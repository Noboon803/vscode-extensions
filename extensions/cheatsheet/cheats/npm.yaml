name: npm
cheats:
  - title: パッケージをインストール
    code: npm install
    options:
      - flag: -D
        label: 開発用
        type: flag
      - flag: -g
        label: グローバル
        type: flag
      - label: パッケージ
        multiple: true
        placeholder: lodash
    notes: パッケージを省略すると package.json の内容をインストールします。
  - title: ロックファイルどおりにインストール
    description: package-lock.json に従ってインストールします。CI に向いています。
    code: npm ci
    notes: 既存の node_modules は削除されます。
  - title: パッケージを削除
    code: npm uninstall
    options:
      - label: パッケージ
        multiple: true
        required: true
        placeholder: lodash
  - title: スクリプトを実行
    code: npm run
    options:
      - label: スクリプト
        placeholder: build
      - flag: -w
        multiple: true
        label: ワークスペース
        placeholder: my-package
    notes: スクリプトを省略すると一覧を表示します。
  - title: テストを実行
    code: npm test
  - title: プロジェクトを初期化
    code: npm init -y
    notes: -y を付けると、質問なしで package.json を作ります。
  - title: インストール済みの一覧
    code: npm ls
    options:
      - flag: --depth
        label: 階層
        default: 0
      - flag: -g
        label: グローバル
        type: flag
  - title: 更新できるパッケージを確認
    code: npm outdated
  - title: パッケージを更新
    code: npm update
    options:
      - label: パッケージ
        multiple: true
        placeholder: lodash
  - title: パッケージの情報を確認
    code: npm view
    options:
      - label: パッケージ
        required: true
        placeholder: lodash
      - label: 項目
        placeholder: version
  - title: パッケージを一時的に実行
    code: npx
    options:
      - label: パッケージ
        required: true
        placeholder: cowsay
      - label: 引数
        multiple: true
        placeholder: hello
  - title: 脆弱性を確認
    code: npm audit
    options:
      - flag: --omit
        multiple: true
        label: 除外する種類
        placeholder: dev
        separator: "="
  - title: 脆弱性を修正
    code: npm audit fix
    notes: --force を付けると破壊的な更新も適用します。
  - title: バージョンを確認
    description: 今のパッケージと npm、Node などのバージョンを表示します。
    code: npm version
    notes: npm 本体のバージョンだけなら npm -v を使います。
  - title: バージョンを上げる
    description: 作業中のパッケージのバージョンを上げます。
    code: npm version
    options:
      - label: 種類
        required: true
        default: patch
    notes: patch は 1.2.3 → 1.2.4、minor は 1.3.0、major は 2.0.0 になります。1.5.0 のように直接指定もできます。Git リポジトリでは、コミットとタグも作ります。種類を空にすると、バージョンの表示になります。
  - title: npm 自身を更新
    code: npm install -g
    options:
      - label: バージョン
        required: true
        default: npm@latest
    notes: Node が対応していないと EBADENGINE のエラーになります。Node を更新するか、npm@11 のように対応するバージョンを指定します。
  - title: 公開内容を確認
    description: 実際には公開せず、含まれるファイルを確認します。
    code: npm publish --dry-run
  - title: パッケージをファイルにまとめる
    code: npm pack
  - title: 設定を確認
    code: npm config list
  - title: レジストリにログイン
    code: npm login
